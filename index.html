<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blue Berry — Live Trading Signal</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #172554 0%, #07111f 45%, #020617 100%);
    color: #ffffff;
    min-height: 100vh;
}

.container {
    width: min(1100px, 94%);
    margin: auto;
    padding: 25px 0 50px;
}

.header {
    text-align: center;
    padding: 25px 10px;
}

.logo {
    font-size: 45px;
    margin-bottom: 5px;
}

.title {
    font-size: 32px;
    font-weight: 800;
}

.subtitle {
    color: #94a3b8;
    margin-top: 8px;
}

.panel {
    background: rgba(15, 23, 42, 0.82);
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 20px;
    padding: 22px;
    margin-top: 20px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.25);
}

.settings {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 15px;
    align-items: end;
}

label {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 7px;
}

select {
    width: 100%;
    padding: 13px;
    border-radius: 11px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    min-width: 170px;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.signal-box {
    text-align: center;
    padding: 30px 15px;
}

.signal-label {
    color: #94a3b8;
    font-size: 14px;
}

.signal {
    font-size: 58px;
    font-weight: 900;
    margin: 10px 0;
}

.waiting {
    color: #60a5fa;
}

.up {
    color: #22c55e;
}

.down {
    color: #ef4444;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.card {
    background: rgba(30, 41, 59, 0.65);
    border-radius: 15px;
    padding: 20px;
    border: 1px solid rgba(148,163,184,0.1);
}

.card-title {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 8px;
}

.card-value {
    font-size: 22px;
    font-weight: 800;
}

.reason {
    color: #cbd5e1;
    line-height: 1.6;
    margin-top: 10px;
}

.status {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin-top: 18px;
}

@media (max-width: 750px) {
    .settings {
        grid-template-columns: 1fr;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    button {
        width: 100%;
    }

    .title {
        font-size: 27px;
    }

    .signal {
        font-size: 48px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🫐</div>

        <div class="title">
            Blue Berry
        </div>

        <div class="subtitle">
            Smart Live Trading Signal System
        </div>
    </div>

    <div class="panel">

        <div class="settings">

            <div>
                <label>PAIR</label>

                <select id="pair">
                    <option>EUR/USD</option>
                    <option>GBP/USD</option>
                    <option>USD/JPY</option>
                    <option>USD/CHF</option>
                    <option>AUD/USD</option>
                    <option>USD/CAD</option>
                    <option>NZD/USD</option>
                </select>
            </div>

            <div>
                <label>TIMEFRAME</label>

                <select id="timeframe">
                    <option value="5">5 Seconds</option>
                    <option value="10">10 Seconds</option>
                    <option value="15">15 Seconds</option>
                    <option value="30">30 Seconds</option>
                    <option value="60">1 Minute</option>
                </select>
            </div>

            <button id="analyzeButton" onclick="analyze()">
                START ANALYZE
            </button>

        </div>

    </div>

    <div class="panel">

        <div class="signal-box">

            <div class="signal-label">
                CURRENT TRADING DIRECTION
            </div>

            <div id="signal" class="signal waiting">
                WAITING
            </div>

            <div id="pairDisplay">
                Select pair and timeframe
            </div>

        </div>

        <div class="grid">

            <div class="card">
                <div class="card-title">
                    LIVE PRICE
                </div>

                <div id="price" class="card-value">
                    —
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    SIGNAL STRENGTH
                </div>

                <div id="strength" class="card-value">
                    —
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    ESTIMATED MOVE
                </div>

                <div id="move" class="card-value">
                    —
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    TIMEFRAME
                </div>

                <div id="tf" class="card-value">
                    —
                </div>
            </div>

        </div>

    </div>

    <div class="panel">

        <div class="card-title">
            ANALYSIS REASON
        </div>

        <div id="reason" class="reason">
            Press START ANALYZE to begin market analysis.
        </div>

        <div id="status" class="status">
            Blue Berry engine ready
        </div>

    </div>

</div>

<script>

const API_BASE =
    "https://blue-berry.malikontop643.workers.dev";


async function getHistory(pair) {

    const url =
        API_BASE +
        "/api/history?pair=" +
        encodeURIComponent(pair) +
        "&interval=1min&outputsize=60";

    const response = await fetch(url, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            "Market history error: HTTP " +
            response.status
        );
    }

    const data = await response.json();

    if (!data.values || !Array.isArray(data.values)) {
        throw new Error(
            data.message ||
            data.error ||
            "No market history received"
        );
    }

    return data.values;
}


async function getLivePrice(pair) {

    const url =
        API_BASE +
        "/api/price?pair=" +
        encodeURIComponent(pair);

    const response = await fetch(url, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            "Price error: HTTP " +
            response.status
        );
    }

    const data = await response.json();

    if (!data.price) {
        throw new Error(
            data.message ||
            data.error ||
            "No live price received"
        );
    }

    return Number(data.price);
}


function calculateEMA(prices, period) {

    if (prices.length < period) {
        return null;
    }

    const multiplier =
        2 / (period + 1);

    let ema = 0;

    for (let i = 0; i < period; i++) {
        ema += prices[i];
    }

    ema = ema / period;

    for (let i = period; i < prices.length; i++) {

        ema =
            (prices[i] - ema) *
            multiplier +
            ema;
    }

    return ema;
}


function calculateRSI(prices, period = 14) {

    if (prices.length <= period) {
        return 50;
    }

    let gains = 0;
    let losses = 0;

    for (let i = 1; i <= period; i++) {

        const change =
            prices[i] - prices[i - 1];

        if (change >= 0) {
            gains += change;
        } else {
            losses += Math.abs(change);
        }
    }

    let averageGain =
        gains / period;

    let averageLoss =
        losses / period;

    for (
        let i = period + 1;
        i < prices.length;
        i++
    ) {

        const change =
            prices[i] - prices[i - 1];

        const gain =
            change > 0 ? change : 0;

        const loss =
            change < 0 ? Math.abs(change) : 0;

        averageGain =
            ((averageGain * (period - 1)) + gain)
            / period;

        averageLoss =
            ((averageLoss * (period - 1)) + loss)
            / period;
    }

    if (averageLoss === 0) {
        return 100;
    }

    const rs =
        averageGain / averageLoss;

    return 100 - (100 / (1 + rs));
}


function calculateMomentum(prices) {

    if (prices.length < 6) {
        return 0;
    }

    const current =
        prices[prices.length - 1];

    const previous =
        prices[prices.length - 6];

    return current - previous;
}


function generateSignal(prices) {

    const current =
        prices[prices.length - 1];

    const ema9 =
        calculateEMA(prices, 9);

    const ema21 =
        calculateEMA(prices, 21);

    const rsi =
        calculateRSI(prices, 14);

    const momentum =
        calculateMomentum(prices);

    let score = 0;

    const reasons = [];


    if (ema9 && ema21) {

        if (ema9 > ema21) {

            score += 2;

            reasons.push(
                "short EMA is above long EMA"
            );

        } else {

            score -= 2;

            reasons.push(
                "short EMA is below long EMA"
            );
        }
    }


    if (ema9) {

        if (current > ema9) {

            score += 1;

            reasons.push(
                "price is above EMA"
            );

        } else {

            score -= 1;

            reasons.push(
                "price is below EMA"
            );
        }
    }


    if (rsi >= 55 && rsi < 70) {

        score += 2;

        reasons.push(
            "RSI shows bullish momentum"
        );

    } else if (rsi <= 45 && rsi > 30) {

        score -= 2;

        reasons.push(
            "RSI shows bearish momentum"
        );

    } else if (rsi >= 70) {

        score -= 1;

        reasons.push(
            "RSI is overbought"
        );

    } else if (rsi <= 30) {

        score += 1;

        reasons.push(
            "RSI is oversold"
        );
    }


    if (momentum > 0) {

        score += 1;

        reasons.push(
            "recent momentum is positive"
        );

    } else if (momentum < 0) {

        score -= 1;

        reasons.push(
            "recent momentum is negative"
        );
    }


    let direction;

    if (score > 0) {
        direction = "UP";
    } else if (score < 0) {
        direction = "DOWN";
    } else {
        direction = "NEUTRAL";
    }


    const maxScore = 7;

    let strength =
        Math.round(
            50 +
            (Math.abs(score) / maxScore) * 45
        );

    strength =
        Math.max(
            50,
            Math.min(95, strength)
        );


    const recentPrices =
        prices.slice(-6);

    const first =
        recentPrices[0];

    const last =
        recentPrices[recentPrices.length - 1];

    let movePercent = 0;

    if (first !== 0) {

        movePercent =
            ((last - first) / first) * 100;
    }

    return {
        direction,
        strength,
        movePercent,
        rsi,
        ema9,
        ema21,
        momentum,
        reasons
    };
}


async function analyze() {

    const pair =
        document.getElementById("pair").value;

    const timeframe =
        document.getElementById("timeframe").value;

    const signal =
        document.getElementById("signal");

    const price =
        document.getElementById("price");

    const strength =
        document.getElementById("strength");

    const move =
        document.getElementById("move");

    const tf =
        document.getElementById("tf");

    const reason =
        document.getElementById("reason");

    const status =
        document.getElementById("status");

    const pairDisplay =
        document.getElementById("pairDisplay");

    const button =
        document.getElementById("analyzeButton");


    signal.className =
        "signal waiting";

    signal.innerText =
        "ANALYZING...";

    price.innerText =
        "Loading...";

    strength.innerText =
        "—";

    move.innerText =
        "—";

    tf.innerText =
        timeframe === "60"
        ? "1 Minute"
        : timeframe + " Sec";

    pairDisplay.innerText =
        pair +
        " — " +
        (
            timeframe === "60"
            ? "1 Minute"
            : timeframe + " Seconds"
        );

    reason.innerText =
        "Collecting live market history and calculating indicators...";

    status.innerText =
        "Blue Berry analyzing market...";

    button.disabled = true;

    button.innerText =
        "ANALYZING...";


    try {

        const results =
            await Promise.all([
                getLivePrice(pair),
                getHistory(pair)
            ]);

        const livePrice =
            results[0];

        const history =
            results[1];


        const candles =
            [...history].reverse();

        const prices =
            candles.map(
                candle => Number(candle.close)
            );


        if (prices.length < 21) {
            throw new Error(
                "Not enough market data for analysis."
            );
        }


        const analysis =
            generateSignal(prices);


        price.innerText =
            livePrice.toString();


        if (analysis.direction === "UP") {

            signal.className =
                "signal up";

            signal.innerText =
                "🟢 UP";

        } else if (analysis.direction === "DOWN") {

            signal.className =
                "signal down";

            signal.innerText =
                "🔴 DOWN";

        } else {

            signal.className =
                "signal waiting";

            signal.innerText =
                "⚪ NEUTRAL";
        }


        strength.innerText =
            analysis.strength + "%";


        const moveValue =
            Math.abs(
                analysis.movePercent
            ).toFixed(3);

        if (analysis.movePercent > 0) {

            move.innerText =
                "+" + moveValue + "%";

        } else if (analysis.movePercent < 0) {

            move.innerText =
                "-" + moveValue + "%";

        } else {

            move.innerText =
                "0.000%";
        }


        const rsiText =
            analysis.rsi.toFixed(1);

        const emaText =
            analysis.ema9.toFixed(5) +
            " / " +
            analysis.ema21.toFixed(5);

        reason.innerText =
            "EMA9 / EMA21: " +
            emaText +
            ". RSI: " +
            rsiText +
            ". " +
            analysis.reasons.join(". ") +
            ".";


        status.innerText =
            "Live market analysis complete — " +
            history.length +
            " candles analyzed";


    } catch (error) {

        signal.className =
            "signal waiting";

        signal.innerText =
            "ERROR";

        price.innerText =
            "—";

        strength.innerText =
            "—";

        move.innerText =
            "—";

        reason.innerText =
            error.message ||
            "Unable to analyze market.";

        status.innerText =
            "Analysis failed — please try again";
    }


    button.disabled = false;

    button.innerText =
        "START ANALYZE";
}

</script>

</body>
    </html>
